<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LACMES | Liga Acadêmica de Clínica Médica de Santarém</title>
  <meta name="description" content="Portal da Liga Acadêmica de Clínica Médica de Santarém (UEPA): fórum, casos clínicos, projetos, estágios, aulas e certificados.">
  <meta name="theme-color" content="#163A5C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LACMES">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>
<body>
  <div id="carregando"><img class="carregando-logo" src="assets/logo-lacmes.png" alt="LACMES"></div>

  <div id="tela-login" hidden>
    <div class="login-caixa">
      <div class="login-marca">
        <img src="assets/logo-lacmes.png" alt="">
        <h1>LACMES</h1>
        <p>Liga Acadêmica de Clínica Médica de Santarém</p>
      </div>
      <div id="login-form-area"></div>
    </div>
  </div>

  <div id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sb-topo">
        <img src="assets/logo-lacmes.png" alt="">
        <div class="sb-marca"><strong>LACMES</strong><small>Liga Acadêmica de Clínica Médica</small></div>
        <button class="btn-ic btn-recolher" data-action="toggleSidebar" title="Recolher menu" aria-label="Recolher menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
      <nav id="nav" aria-label="Menu principal"></nav>
      <div class="sb-rodape">
        <button class="btn btn-peq btn-bloco sb-instalar" data-action="instalarApp" style="margin-bottom:6px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/></svg><span>Instalar app</span></button>
        <div id="sync" class="sync"><span>Conectando…</span></div>
        <div id="sb-usuario" data-action="ir" data-rota="perfil"></div>
      </div>
    </aside>
    <div class="gaveta-fundo" data-action="fecharGaveta"></div>

    <div class="principal">
      <div class="banner-demo">.</div>
      <header class="topo">
        <img class="topo-logo" src="assets/logo-lacmes.png" alt="">
        <div id="titulo-pagina"></div>
        <button class="btn-ic sino" data-action="alternarSino" title="Notificações" aria-label="Notificações">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2H4.5z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
          <span id="sino-badge" hidden></span>
        </button>
        <div id="sino-painel" role="dialog" aria-label="Notificações">
          <div class="sino-cab"><h4>Notificações</h4><button class="link" data-action="lerTodas">Marcar todas como lidas</button></div>
          <div id="notif-lista"></div>
        </div>
      </header>
      <main id="view"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Navegação rápida"></nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
